<!DOCTYPE html>
<html>
  <head>
      <style>
        body{
          background-color:black;

    <script>
      function anv5(){
        let R = Number(document.getElementById("anv").value) ; 
        let I = Number(document.getElementById("anv3").value) ; 

        let V = I*R ; 

        document.getElementById("anv2").value=V  ; 
      }
      function anv6(){
        let R = Number(document.getElementById("anv").value) ; 
        let V = Number(document.getElementById("anv2").value) ; 

        let I = V/R ; 

        document.getElementById("anv3").value = I ;  
      }
      function anv4(){
        let V = Number(document.getElementById("anv2").value) ; 
        let I = Number(document.getElementById("anv3").value) ; 

        let R = V/I ; 

        document.getElementById("anv").value = R ;  
      }
      function anv7(){
        document.getElementById("anv").value = "" ; 
        document.getElementById("anv2").value ="" ;
        document.getElementById("anv3").value = "" ; 
      }
    </script>
  </head>
  <body>
    <h1>#OHM LAW`S</h1> 
    <input id="anv" placeholder="ENTER THE RESISTANCE" type="number">

    <button onclick="anv4()"><b>R</b></button>
